services:
  postgres:
    container_name: pg-warga
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pendaftaran
      POSTGRES_DB: pendaftaran
    ports:
      - "15432:5432"
    volumes:
      - pg-warga-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg-warga-data:
